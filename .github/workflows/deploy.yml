name: Deploy to GitHub Pages

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

env:
  DEPLOY_DIR: './deploy'

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Setup Rust toolchain
      uses: dtolnay/rust-toolchain@stable
      with:
        targets: wasm32-unknown-unknown

    - name: Install wasm-pack
      uses: jetli/wasm-pack-action@v0.4.0
      with:
        version: 'latest'

    - name: Build WASM package
      run: wasm-pack build --target web --release --out-dir wwwroot/pkg

    - name: Assemble deploy folder
      run: |
        rm -f wwwroot/pkg/.gitignore
        mkdir -p ${{ env.DEPLOY_DIR }}
        cp -r wwwroot/* ${{ env.DEPLOY_DIR }}/
        touch ${{ env.DEPLOY_DIR }}/.nojekyll

    - name: Setup Node.js for CSS minification
      uses: actions/setup-node@v4
      with:
        node-version: '20'

    - name: Minify CSS files
      run: |
        npm install -g csso-cli
        find ${{ env.DEPLOY_DIR }} -name "*.css" -exec csso {} -o {} \;

    - name: Deploy to GitHub Pages
      uses: JamesIves/github-pages-deploy-action@v4
      with:
        token: ${{ secrets.GITHUB_TOKEN }}
        branch: gh-pages
        folder: ${{ env.DEPLOY_DIR }}
        clean: true
        clean-exclude: |
          .nojekyll
          CNAME
        single-commit: true
