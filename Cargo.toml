[package]
name = "spt_fuyu_patcher_web"
version = "0.1.0"
edition = "2021"
description = "A pure-frontend WASM patcher for the SPT Fuyu launcher"
license-file = "LICENSE"

[package.metadata.wasm-pack.profile.release]
wasm-opt = false

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
wasm-bindgen = "0.2"
wasm-bindgen-futures = "0.4"
js-sys = "0.3"

[dependencies.web-sys]
version = "0.3"
features = ["Window"]

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
panic = "abort"
strip = true
